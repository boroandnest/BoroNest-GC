# Scheduled jobs for the Boro & Nest app (stand-in for pg_cron).
# Calls the app's cron endpoints with a shared secret. Configure two repository secrets:
#   APP_URL      e.g. https://boro-gmp.emergent.host
#   CRON_SECRET  same value as the app's CRON_SECRET environment variable
# Without them every job exits successfully without doing anything.
name: scheduled-jobs

on:
  schedule:
    - cron: '17 9 * * *'     # 05:17 New York (EDT) — COI expiry sweep
    - cron: '*/15 * * * *'   # milestone release (idempotent; safe to overlap)
    - cron: '41 10 * * *'    # 06:41 New York (EDT) — retainer periods + guarantee close
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run now'
        required: true
        default: coi-sweep
        type: choice
        options: [coi-sweep, release-milestones, retainers]

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pick job
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "*/15 * * * *" ]; then echo "job=release-milestones" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "41 10 * * *" ]; then echo "job=retainers" >> "$GITHUB_OUTPUT"
          else echo "job=coi-sweep" >> "$GITHUB_OUTPUT"; fi
      - name: Call endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL / CRON_SECRET not configured; skipping"; exit 0; fi
          curl -fsS --max-time 300 -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/${{ steps.pick.outputs.job }}"
